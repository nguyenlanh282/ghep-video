# Starts the real app on a Windows machine (not only the renderer) to catch start-up errors that pythonw hides.
name: Kiểm tra mở app trên Windows

on:
  workflow_dispatch:

jobs:
  open-app:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cài như khách (tải Python, FFmpeg, thư viện)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File studio\setup-windows.ps1 -NoOpen
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Phiên bản thư viện
        shell: pwsh
        run: '& "$env:APPDATA\GhepVideo\venv\Scripts\python.exe" -m pip list'
      - name: Mở phần máy chủ của app, gọi thử API
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'; $env:GHEPVIDEO_PORT = '8799'
          $p = Start-Process "$env:APPDATA\GhepVideo\venv\Scripts\python.exe" -ArgumentList 'studio\app\main.py','--serve' -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep 15
          Get-Content out.txt; Get-Content err.txt
          $url = (Get-Content out.txt | Select-Object -First 1)
          if (-not $url) { throw 'App không khởi động được (xem lỗi ở trên)' }
          $tok = ($url -split 't=')[1]
          $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/api/state' -Method Post -Body '{}' -ContentType 'application/json' -Headers @{'X-Token'=$tok} -UseBasicParsing
          "state: $($r.StatusCode) $($r.Content.Length) bytes"
          foreach ($page in 'index.html','talk.html') { $x = Invoke-WebRequest -Uri "http://127.0.0.1:8799/${page}?t=$tok" -UseBasicParsing; "$page $($x.StatusCode)" }
          Stop-Process $p -Force
      - name: Mở app có cửa sổ (như khách bấm biểu tượng), ghi lỗi nếu tắt ngay
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $p = Start-Process "$env:APPDATA\GhepVideo\venv\Scripts\python.exe" -ArgumentList 'studio\app\main.py' -PassThru -RedirectStandardOutput gui-out.txt -RedirectStandardError gui-err.txt
          Start-Sleep 25
          "Còn chạy sau 25 giây: $(-not $p.HasExited)"; if ($p.HasExited) { "Mã thoát: $($p.ExitCode)" }
          Get-Content gui-out.txt; Get-Content gui-err.txt
          if (-not $p.HasExited) { Stop-Process $p -Force } else { exit 1 }
      - name: Thiếu thư viện (numpy bị xoá) thì app tự cài lại
        shell: pwsh
        run: |
          $py = "$env:APPDATA\GhepVideo\venv\Scripts\python.exe"
          & "$env:APPDATA\GhepVideo\bin\uv.exe" pip uninstall --python $py numpy 2>&1 | Out-Host
          & $py -c "import numpy" 2>$null; "numpy sau khi xoá: $LASTEXITCODE (khác 0 = đã mất)"
          # the launcher's check says "missing"
          & $py -c "import importlib.util as u,sys; sys.exit(any(u.find_spec(m) is None for m in ('numpy','PIL','webview','faster_whisper','cv2')))"; "kiểm tra của Ghep Video (Windows).bat: $LASTEXITCODE (1 = sẽ tự cài lại)"
          # the app itself: start-up error → runs setup-windows.ps1 in a new window
          $env:GHEPVIDEO_NO_DIALOG = '1'; $env:PYTHONUTF8 = '1'
          & $py studio\app\main.py 2>&1 | Select-Object -Last 3 | Out-Host
          $ok = $false
          foreach ($i in 1..60) { Start-Sleep 5; & $py -c "import numpy" 2>$null; if ($LASTEXITCODE -eq 0) { $ok = $true; break } }
          "numpy đã được cài lại: $ok"; if (-not $ok) { exit 1 }
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
